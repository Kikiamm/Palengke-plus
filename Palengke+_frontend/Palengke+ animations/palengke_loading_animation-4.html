<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palengke Loading Animation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #315e32;
    font-family: system-ui, sans-serif;
  }
  .screen {
    width: min(100vw, 430px);
    height: 100dvh;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 38px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #477d43 0%, #315e32 58%, #244a29 100%);
  }
  .glow {
    position: absolute;
    width: 290px; height: 290px;
    border-radius: 50%;
    background: #9be564;
    opacity: .09;
    filter: blur(3px);
    top: 25%;
  }
  .cart-wrap {
    position: relative;
    width: 300px;
    height: 245px;
    animation: cart-bob 1.4s ease-in-out infinite;
  }
  .cart {
    position: absolute;
    width: 220px;
    height: 140px;
    left: 43px;
    top: 75px;
    transform: skewY(-3deg);
  }
  .plus-badge {
    position: absolute;
    z-index: 5;
    left: 143px;
    top: 15px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #a8e66b;
    color: #244a29;
    border: 3px solid #f3f4df;
    font: 800 27px/1 system-ui, sans-serif;
    box-shadow: 0 3px 10px rgba(0,0,0,.2);
    animation: badge-pop 1.4s ease-in-out infinite;
  }
  .basket {
    position: absolute;
    left: 32px; top: 22px;
    width: 145px; height: 76px;
    border: 7px solid #f3f4df;
    border-top: 5px solid #f3f4df;
    border-radius: 5px 8px 25px 18px;
    transform: skewY(8deg);
    background: repeating-linear-gradient(90deg, transparent 0 25px, rgba(243,244,223,.8) 26px 31px);
    box-shadow: inset 0 -7px 0 rgba(155,229,100,.3);
  }
  .basket::before {
    content: "";
    position: absolute;
    left: -31px; top: -13px;
    width: 34px; height: 8px;
    border-radius: 8px;
    background: #f3f4df;
    transform: rotate(15deg);
  }
  .basket::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px; bottom: -14px;
    height: 7px;
    background: #f3f4df;
    border-radius: 8px;
  }
  .frame {
    position: absolute;
    width: 8px; height: 68px;
    background: #f3f4df;
    left: 20px; top: 29px;
    border-radius: 8px;
    transform: rotate(-19deg);
  }
  .base {
    position: absolute;
    left: 65px; top: 105px;
    width: 113px; height: 8px;
    border-radius: 10px;
    background: #f3f4df;
    transform: rotate(-3deg);
  }
  .wheel {
    position: absolute;
    width: 31px; height: 31px;
    top: 118px;
    border: 6px solid #a8e66b;
    border-right-color: #f3f4df;
    border-bottom-color: #f3f4df;
    border-radius: 50%;
    animation: spin .65s linear infinite;
    box-shadow: 0 0 0 3px rgba(22,55,28,.15);
  }
  .wheel.left { left: 67px; }
  .wheel.right { left: 164px; }
  .veg {
    position: absolute;
    z-index: 2;
    font-size: 39px;
    filter: drop-shadow(0 3px 1px rgba(0,0,0,.15));
    transform-origin: bottom center;
  }
  .v1 { left: 72px; top: 28px; animation: veg-bounce 1.1s ease-in-out infinite; }
  .v2 { left: 104px; top: 8px; font-size: 43px; animation: veg-bounce 1.1s .15s ease-in-out infinite; }
  .v3 { left: 137px; top: 27px; font-size: 37px; animation: veg-bounce 1.1s .3s ease-in-out infinite; }
  .v4 { left: 48px; top: 48px; font-size: 32px; animation: veg-bounce 1.1s .22s ease-in-out infinite; }
  .v5 { left: 159px; top: 48px; font-size: 32px; animation: veg-bounce 1.1s .08s ease-in-out infinite; }
  .speed {
    position: absolute;
    height: 4px;
    border-radius: 4px;
    background: #b5ed83;
    opacity: .8;
    left: 5px;
    animation: streak 1.2s ease-in-out infinite;
  }
  .s1 { top: 119px; width: 28px; }
  .s2 { top: 140px; left: 17px; width: 18px; animation-delay: .35s; }
  .s3 { top: 98px; left: 14px; width: 14px; animation-delay: .6s; }
  .shadow {
    position: absolute;
    bottom: 5px; left: 63px;
    width: 175px; height: 17px;
    background: rgba(15,38,18,.25);
    border-radius: 50%;
    filter: blur(5px);
    animation: shadow 1.4s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes badge-pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  @keyframes cart-bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
  @keyframes veg-bounce { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
  @keyframes streak { 0%,100% { transform: translateX(0); opacity: .35; } 50% { transform: translateX(-9px); opacity: 1; } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .65; } 50% { transform: scaleX(.86); opacity: .4; } }
</style>
</head>
<body>
  <main class="screen" aria-label="Palengke animated loading screen">
    <div class="glow"></div>
    <div class="cart-wrap" aria-hidden="true">
      <div class="shadow"></div>
      <div class="speed s1"></div><div class="speed s2"></div><div class="speed s3"></div>
      <div class="veg v1">🥬</div>
      <div class="veg v2">🥕</div>
      <div class="veg v3">🍅</div>
      <div class="veg v4">🍆</div>
      <div class="veg v5">🥦</div>
      <div class="cart">
        <div class="plus-badge" aria-label="Palengke plus">+</div>
        <div class="frame"></div>
        <div class="basket"></div>
        <div class="base"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
      </div>
    </div>
  </main>
</body>
</html>
